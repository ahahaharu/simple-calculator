<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
  </head>
  <body>
    <div class="calculator">
      <div class="calculator__display">0</div>

      <div class="calculator__buttons">
        <button class="button btn-grey" id="clear">AC</button>
        <button class="button btn-grey" id="negate">+/-</button>
        <button class="button btn-grey" id="percent">%</button>
        <button class="button btn-orange" id="divide">/</button>

        <button class="button" id="seven">7</button>
        <button class="button" id="eight">8</button>
        <button class="button" id="nine">9</button>
        <button class="button btn-orange" id="multiply">×</button>

        <button class="button" id="four">4</button>
        <button class="button" id="five">5</button>
        <button class="button" id="six">6</button>
        <button class="button btn-orange" id="minus">-</button>

        <button class="button" id="one">1</button>
        <button class="button" id="two">2</button>
        <button class="button" id="three">3</button>
        <button class="button btn-orange" id="plus">+</button>

        <button class="button span-two" id="zero">0</button>
        <button class="button" id="decimal">.</button>
        <button class="button btn-orange" id="equals">=</button>
      </div>
    </div>
  </body>
</html>
